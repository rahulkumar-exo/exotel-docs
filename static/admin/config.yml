  # ═══════════════════════════════════════════════════════════════════════
  #  ✨ SCAFFOLD A NEW PRODUCT — for products without their own collection yet
  # ═══════════════════════════════════════════════════════════════════════
  # Use this when you're documenting a brand-new product that doesn't yet
  # have its own dedicated CMS collection. Once the product matures (you
  # have several pages and want a top-level navbar entry), ping
  # rahul.kumar@exotel.com — we'll graduate it like we did with CQA.

  - name: new-products
    label: "✨ NEW: Add a brand-new product"
    description: "📍 docs/new-products/<your-product>/* → developer.exotel.com/docs/new-products/<your-product>/*  •  📂 Navbar: Products → New Products → Your product appears here automatically  •  ⚠️ ALWAYS start the Path with your product slug (e.g. 'my-product/overview') — DON'T start with 'api-reference/' as that creates orphan files"
    folder: docs/new-products
    preview_path: "docs/new-products/{{slug}}"
    create: true
    nested: { depth: 4 }
    meta: { path: { widget: string, label: "Path — start with your product slug, e.g. 'my-product/overview' or 'my-product/api-reference/send'", index_file: overview } }
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Page title — e.g. 'My Product API Overview'" }
      - { label: "Sidebar Label", name: "sidebar_label", widget: "string", required: false, hint: "Short label for the left sidebar (defaults to filename)" }
      - { label: "Sidebar Position", name: "sidebar_position", widget: "number", required: false, hint: "Lower numbers appear higher in the sidebar" }
      - { label: "Body", name: "body", widget: "markdown" }
