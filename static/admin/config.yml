backend:
  name: github
  repo: rahulkumar-exo/exotel-docs
  branch: main
  base_url: https://exotel-docs.vercel.app
  auth_endpoint: api/auth

# These three settings give every CMS entry a "View on web" button so PMs
# can always see exactly where their content lives — both the collection
# list AND each individual entry shows a clickable URL preview.
site_url: https://developer.exotel.com
display_url: https://developer.exotel.com
logo_url: https://developer.exotel.com/img/exotel-logo.png

media_folder: static/img/uploads
public_folder: /img/uploads

publish_mode: editorial_workflow

# ──────────────────────────────────────────────────────────────────────────
# COLLECTION CONVENTIONS — read this if you're touching this file
# ──────────────────────────────────────────────────────────────────────────
# Every collection has:
#   description   — one-liner shown ABOVE the collection in the CMS, telling
#                   PMs the live URL pattern + which navbar entry it appears
#                   under. PMs need this to mentally map "this CMS folder"
#                   → "this section of the site".
#   preview_path  — Decap renders a "View on web" link next to each entry,
#                   constructed from this template + the entry's slug.
#                   For nested collections {{slug}} = the Path field value.
#   no `id` field — the `id` frontmatter field is intentionally NOT exposed.
#                   Docusaurus generates URLs from the file path; letting PMs
#                   set `id` lets them accidentally override the URL and end
#                   up with mismatched paths (this bit us once with CQA).
# ──────────────────────────────────────────────────────────────────────────

collections:
  # ═══════════════════════════════════════════════════════════════════════
  #  CORE API REFERENCE — appears in: navbar → API Reference dropdown
  # ═══════════════════════════════════════════════════════════════════════

  - name: voice-v1
    label: "📞 Voice v1"
    description: "📍 docs/voice-v1/* → developer.exotel.com/docs/voice-v1/*  •  📂 Navbar: API Reference → Voice → Voice v1"
    folder: docs/voice-v1
    preview_path: "docs/voice-v1/{{slug}}"
    create: true
    nested: { depth: 3 }
    meta: { path: { widget: string, label: "Path (e.g. api-reference/connect-two-numbers)", index_file: overview } }
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Page heading shown at the top of the page" }
      - { label: "Sidebar Label", name: "sidebar_label", widget: "string", required: false, hint: "Short label for the left sidebar (defaults to title if empty)" }
      - { label: "Sidebar Position", name: "sidebar_position", widget: "number", required: false, hint: "Lower numbers appear higher. Leave blank to keep current order." }
      - { label: "Body", name: "body", widget: "markdown" }

