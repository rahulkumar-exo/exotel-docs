backend:
  name: github
  repo: rahulkumar-exo/exotel-docs
  branch: main
  base_url: https://exotel-docs.vercel.app
  auth_endpoint: api/auth

media_folder: static/img/uploads
public_folder: /img/uploads

publish_mode: editorial_workflow

collections:
  # ─── Voice v1 ───────────────────────────────────────────
  - name: voice-v1
    label: "Voice v1"
    folder: docs/voice-v1
    create: true
    nested:
      depth: 3
    meta: { path: { widget: string, label: "Path", index_file: overview } }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Document ID", name: "id", widget: "string", required: false }
      - { label: "Sidebar Label", name: "sidebar_label", widget: "string", required: false }
      - { label: "Sidebar Position", name: "sidebar_position", widget: "number", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

