  # ─── ✨ Add New Product Documentation ──────────────────
  # PMs use this collection to scaffold docs for a brand-new product
  # without waiting for engineering. The first segment of "Path" becomes
  # the product folder, e.g. Path = "my-new-product/overview" creates
  #   docs/new-products/my-new-product/overview.md
  # served at  /docs/new-products/my-new-product/overview
  # Pages auto-appear in the "New Products" navbar section (autogenerated
  # sidebar). Once a product graduates to a top-level collection, an
  # engineer promotes it into its own folder + sidebar.
  - name: new-products
    label: "✨ Add New Product Documentation"
    folder: docs/new-products
    create: true
    nested:
      depth: 4
    meta: { path: { widget: string, label: "Path (use <product-slug>/<page>, e.g. my-product/overview)", index_file: overview } }
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Page title — e.g. 'My Product API Overview'" }
      - { label: "Document ID", name: "id", widget: "string", required: false }
      - { label: "Sidebar Label", name: "sidebar_label", widget: "string", required: false, hint: "Short label for the left sidebar (defaults to filename)" }
      - { label: "Sidebar Position", name: "sidebar_position", widget: "number", required: false, hint: "Lower numbers appear higher in the sidebar" }
      - { label: "Body", name: "body", widget: "markdown" }
