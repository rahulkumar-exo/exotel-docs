image: node:20

definitions:
  caches:
    npm: ~/.npm

pipelines:
  branches:
    main:
      - step:
          name: Sync to GitHub
          script:
            - git config user.email "ci@exotel.com"
            - git config user.name "Bitbucket CI"
            - git remote add github https://x-token-auth:${GITHUB_TOKEN}@github.com/rahulkumar-exo/exotel-docs.git
            - git fetch github
            - git merge github/main --no-edit || (
                git checkout --theirs -- data/ai-search-logs.json 2>/dev/null || true &&
                git checkout --theirs -- data/ai-chat-feedback.json 2>/dev/null || true &&
                git add data/ &&
                git merge --continue --no-edit
              )
            - git push github HEAD:main
      - step:
          name: Build and Deploy to Vercel
          caches:
            - npm
          script:
            - npm ci
            - npm run build
            - npx vercel deploy --prod --token=$VERCEL_TOKEN
